[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Don't publish the source/tooling folders.
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
